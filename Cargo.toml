[package]
name = "signet"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A CRD-free Kubernetes X.509-SVID issuer for Interlink"
license = "MIT"
repository = "https://github.com/alexandernicholson/signet"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive", "env"] }
futures = "0.3.31"
httparse = "1.10.1"
getrandom = "0.3.4"
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
kube = { version = "4.2.0", features = ["runtime"] }
rcgen = { version = "0.14.8", features = ["x509-parser", "zeroize"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
x509-parser = { version = "0.18.1", features = ["verify"] }
zeroize = "1.9.0"

[dev-dependencies]
assert_cmd = "2.1.1"
base64ct = { version = "1.8.0", features = ["alloc"] }
bytes = "1.11.0"
http = "1.4.0"
http-body-util = "0.1.3"
predicates = "3.1.3"
ntest_timeout = "0.9.5"
proptest = "1.9.0"
tempfile = "3.24.0"
tower = "0.5.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"
