name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint every target
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run all targets
        run: cargo test --locked --all-targets

  build:
    name: Build release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build optimized binary
        run: cargo build --locked --release --bin signet
      - name: Smoke-test optimized binary
        run: target/release/signet --help
      - name: Package binary and checksum
        run: |
          set -euo pipefail
          artifact="signet-x86_64-unknown-linux-gnu"
          install -Dm755 target/release/signet "$RUNNER_TEMP/$artifact/signet"
          tar -C "$RUNNER_TEMP" -czf "$artifact.tar.gz" "$artifact"
          sha256sum "$artifact.tar.gz" > "$artifact.tar.gz.sha256"
      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: signet-x86_64-unknown-linux-gnu
          path: |
            signet-x86_64-unknown-linux-gnu.tar.gz
            signet-x86_64-unknown-linux-gnu.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.89
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - name: Check every target
        run: cargo check --locked --all-targets

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      CARGO_LLVM_COV_VERSION: "0.8.7"
      CARGO_LLVM_COV_SHA256: "9a75fe29538d3800b3da57f6f6efb64cba5c720a257bf0cb8b51f39d495a9168"
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust and LLVM tools
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable
      - name: Install cargo-llvm-cov release binary
        run: |
          set -euo pipefail
          archive="cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${CARGO_LLVM_COV_VERSION}/$archive" \
            --output "$archive_path"
          echo "$CARGO_LLVM_COV_SHA256  $archive_path" | sha256sum --check -
          tar -xzf "$archive_path" -C "$HOME/.cargo/bin"
          cargo llvm-cov --version
      - name: Enforce complete line coverage
        run: cargo llvm-cov --locked --all-targets --summary-only --fail-under-lines 100

  supply-chain:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    env:
      CARGO_AUDIT_VERSION: "0.22.2"
      CARGO_AUDIT_SHA256: "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39"
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-audit release binary
        run: |
          set -euo pipefail
          archive="cargo-audit-x86_64-unknown-linux-gnu-v${CARGO_AUDIT_VERSION}.tgz"
          archive_path="$RUNNER_TEMP/$archive"
          bin_dir="$RUNNER_TEMP/bin"
          mkdir -p "$bin_dir"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors \
            "https://github.com/RustSec/rustsec/releases/download/cargo-audit/v${CARGO_AUDIT_VERSION}/$archive" \
            --output "$archive_path"
          echo "$CARGO_AUDIT_SHA256  $archive_path" | sha256sum --check -
          tar -xzf "$archive_path" -C "$RUNNER_TEMP"
          install -m 0755 \
            "$RUNNER_TEMP/${archive%.tgz}/cargo-audit" \
            "$bin_dir/cargo-audit"
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/cargo-audit" audit --version
      - name: Audit locked dependencies
        run: cargo-audit audit
      - name: Verify archived RFC sources
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import tomllib

          root = pathlib.Path("rfcs")
          manifest = tomllib.loads((root / "SOURCES.toml").read_text())
          for source in manifest["rfc"]:
              path = root / f"rfc{source['number']}.txt"
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != source["sha256"]:
                  raise SystemExit(f"checksum mismatch: {path}")
          print(f"verified {len(manifest['rfc'])} RFC source files")
          PY

  packaging:
    name: Container and Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build production container
        run: docker build --tag signet:ci .
      - name: Smoke-test production container
        run: docker run --rm signet:ci --help
      - name: Generate disposable deployment CA
        run: cargo run --locked --release -- bootstrap --output-dir deploy/ca --validity-days 1
      - name: Render Kubernetes deployment
        run: go run sigs.k8s.io/kustomize/kustomize/v5@v5.8.1 build deploy > /tmp/signet-rendered.yaml

  image:
    name: Publish multi-architecture image
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs:
      - quality
      - test
      - build
      - msrv
      - coverage
      - supply-chain
      - packaging
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: signet-image-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and publish OCI image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Report immutable image digest
        run: echo "ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}"
