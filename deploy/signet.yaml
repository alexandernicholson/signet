apiVersion: v1
kind: Namespace
metadata:
  name: signet-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: signet
  namespace: signet-system
  labels:
    app.kubernetes.io/name: signet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: signet-settings
  namespace: signet-system
data:
  SIGNET_SIGNER_NAME: example.com/signet
  SIGNET_TRUST_DOMAIN: example.com
  SIGNET_ALLOW_SERVICE_ACCOUNTS: workloads:example-app,workloads:example-canary
  SIGNET_MAX_TTL_SECONDS: "86400"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: signet
rules:
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests/approval"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["signers"]
    resourceNames: ["example.com/signet"]
    verbs: ["approve", "sign"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: signet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: signet
subjects:
  - kind: ServiceAccount
    name: signet
    namespace: signet-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signet
  namespace: signet-system
  labels:
    app.kubernetes.io/name: signet
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: signet
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signet
    spec:
      serviceAccountName: signet
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: signet
      containers:
        - name: signet
          image: ghcr.io/alexandernicholson/signet:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["run"]
          envFrom:
            - configMapRef:
                name: signet-settings
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: ca
              mountPath: /var/run/signet-ca
              readOnly: true
      volumes:
        - name: ca
          secret:
            secretName: signet-ca
            defaultMode: 0440
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: signet
  namespace: signet-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: signet
