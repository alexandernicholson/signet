apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: signet-system
resources:
  - signet.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: signet
secretGenerator:
  - name: signet-ca
    type: Opaque
    files:
      - ca.crt=ca/ca.crt
      - ca.key=ca/ca.key
configMapGenerator:
  - name: interlink-trust-bundle
    files:
      - ca-bundle.pem=ca/bundle.pem
